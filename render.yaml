services:


  # Frontend React — Static Site (type: web + runtime: static)
  - type: web
    name: koval-dev-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://koval-dev-backend.onrender.com

